<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfa Materiales Eldorado</title>
    <link rel="icon" type="image/png" sizes="32x32" href="fotos/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="fotos/favicon.png">
    <link rel="apple-touch-icon" href="fotos/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <aside class="columna-relleno">
            <header>
                <h1 class="logo">Alfa Materiales</h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <a class="boton-menu boton-volver" href="index.html"><i class="bi bi-arrow-left-square-fill"></i>
                            Seguir comprando
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito active" href="carrito.html"><i class="bi bi-cart"></i>Carrito<span class="numerito">0</span></a>
                    </li>
                    <li>
                        <a class="boton-menu boton-contacto" href="contacto.html"><i class="bi bi-geo-alt"></i>Contacto</a>
                    </li>
                </ul>
            </nav>
            <footer class="texto-footer">
                © 2003 Alfa Materiales de Construcción.
            </footer>
        </aside>
        <main>
            <h2 class="titulo">Carrito</h2>
            <div class="contenedor-carrito">
                <p class="carrito-vacio">Tu carrito está vacío.</p>
                <div class="carrito-productos">
                    <!-- Los productos del carrito se generan automáticamente desde script.js -->
                </div>
                <div class="carrito-acciones">
                    <div class="carrito-acciones-izquierda">
                        <button class="carrito-acciones-vaciar">Vaciar carrito</button>
                    </div>
                    <div class="carrito-resumen">
                        <p class="carrito-total"></p>
                        <p class="carrito-envio"></p>
                    </div>
                    <div class="carrito-acciones-derecha">
                        <button></button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
